name: stars
on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          total=$(gh api --paginate /users/${{ github.repository_owner }}/repos \
            --jq '[.[] | select(.fork | not) | .stargazers_count] | add // 0' \
            | paste -sd+ | bc)
          printf '{\n  "schemaVersion": 1,\n  "label": "stars",\n  "message": "%s",\n  "color": "c2a56b"\n}\n' "$total" > stars.json
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add stars.json
          git diff --staged --quiet || git commit -m "chore: update star count"
          git push
